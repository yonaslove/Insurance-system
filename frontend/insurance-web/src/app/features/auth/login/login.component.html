<div class="login-page">
  <!-- Decorative Background Blobs Matching Design -->
  <div class="bg-blob bg-blob-tr"></div>
  <div class="bg-blob bg-blob-bl"></div>

  <div class="login-container">
    <div class="login-card">
      
      @if (errorMessage) {
        <div class="alert alert-error">
          <span class="alert-icon">⚠️</span>
          <span>{{ errorMessage }}</span>
        </div>
      }

      @if (infoMessage) {
        <div class="alert alert-info">
          <span class="alert-icon">ℹ️</span>
          <span>{{ infoMessage }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email / Username Field -->
        <div class="form-group">
          <label for="username">Your email</label>
          <div class="input-container active-border">
            <div class="icon-compartment">
              <!-- User Silhouette Icon matching screenshot -->
              <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
              </svg>
            </div>
            <input 
              id="username" 
              name="username" 
              type="text" 
              [(ngModel)]="username" 
              placeholder="e.g. elon@tesla.com"
              required 
              autocomplete="username"
              class="form-input" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Your password</label>
          <div class="input-container">
            <div class="icon-compartment">
              <!-- Padlock Icon matching screenshot -->
              <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.7 1.4-3.1 3.1-3.1s3.1 1.4 3.1 3.1v2z"/>
              </svg>
            </div>
            <input 
              id="password" 
              name="password" 
              type="password" 
              [(ngModel)]="password" 
              placeholder="e.g. ilovemangools123"
              required 
              autocomplete="current-password"
              class="form-input" />
          </div>
        </div>

        <!-- Green Pill Button -->
        <button 
          type="submit" 
          class="btn-signin" 
          [disabled]="loading || !username || !password">
          @if (loading) {
            <span class="spinner"></span>
            <span>Signing in...</span>
          } @else {
            <span>Sign in</span>
          }
        </button>

        <!-- Bottom Links -->
        <div class="footer-links">
          <a routerLink="/register" class="link-item">Don't have an account?</a>
          <button type="button" (click)="onForgotPassword()" class="link-item link-btn">Forgot password?</button>
        </div>
      </form>

    </div>
  </div>
</div>
