server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-route
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/auth/**
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/api/v1/policies/**
        - id: claims-service
          uri: lb://claims-service
          predicates:
            - Path=/api/v1/claims/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  rate-limit:
    enabled: true
    default-replenish-rate: 120
    default-burst-capacity: 150
    auth-replenish-rate: 30
    auth-burst-capacity: 40

